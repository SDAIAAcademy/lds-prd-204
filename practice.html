<section>
<h2>اليوم 1: التخطيط تحت عدم اليقين</h2>
<ol>
<li><p>خدمة توجيه المراسلات في الإدارة القانونية تبدأ مرحلة مدتها ثلاثة أسابيع لاختبار الفاكسات الممسوحة. أي صياغة لمعيار الخروج يحكم عليها المراجع دون أن يسأل الفريق؟</p><ul><li><b>أ.</b> تحسن واضح في توجيه الفاكسات مقارنة بالتجربة</li><li><b>ب.</b> دقة 90% أو أكثر على 300 فاكس مثبتة قبل التشغيل، وإلا فإلى موظف</li><li><b>ج.</b> إنهاء ضبط النموذج على الفاكسات في الأسابيع الثلاثة</li><li><b>د.</b> دقة كلية 92% أو أكثر على كل الرسائل الواردة إلى الإدارة في الشهر الأول</li></ul></li>
<li><p>خطة لخدمة تلخيص محاضر اللجان مدتها 8 أسابيع. في فئتك المرجعية أربعة مشروعات ذكاء اصطناعي نسبها 1.2 و1.4 و1.5 و2.1، وثمانية مشروعات بلا نموذج نسبها أقل. ماذا تقول للراعي؟</p><ul><li><b>أ.</b> 8 أسابيع كما في الخطة المعتمدة، مع هامش صغير للطوارئ</li><li><b>ب.</b> نطاق من كل المشروعات الاثني عشر معًا</li><li><b>ج.</b> 16.8 أسبوعًا، أطول ما تأخر مشروع مشابه</li><li><b>د.</b> نحو 12 أسبوعًا، وحتى 14 أسبوعًا بالمئين 80</li></ul></li>
<li><p>بوابة خدمة تلخيص محاضر اللجان: معيار الخروج 92% من الملخصات بلا خطأ جوهري على 250 محضرًا مثبتًا. النتيجة 90.4%، والأخطاء كلها في محاضر اللجان الفنية، وبقية المحاضر فوق 96%. الإنفاق ضمن الخطة. ما القرار؟</p><ul><li><b>أ.</b> تغيير الاتجاه: محاضر اللجان الفنية إلى كاتب، والباقي يمضي بهدف جديد</li><li><b>ب.</b> المضي: الفرق صغير والقاعة راضية عن الملخصات</li><li><b>ج.</b> التوقف: لم يتحقق معيار الخروج على المجموعة المثبتة، فلا فائدة من الاستمرار</li><li><b>د.</b> المضي بعد خفض معيار الخروج إلى 90%</li></ul></li>
<li><p>مكتب خدمة المستفيدين في الوزارة يريد مساعدًا يقترح ردودًا على الرسائل. لم يُجرَّب شيء بعد. أي مرحلة أولى تختبر فرضية بدل أن تلتزم بنطاق؟</p><ul><li><b>أ.</b> بناء المساعد كاملًا في ثمانية أسابيع ثم قياسه</li><li><b>ب.</b> تدريب الموظفين كلهم على المساعد قبل اختيار الأداة نفسها</li><li><b>ج.</b> أسبوعان على 200 رسالة مثبتة: هل يُقبل 70% من الردود؟</li><li><b>د.</b> شراء ترخيص سنوي لأداة جاهزة ثم تحديد استعمالها في المكتب</li></ul></li>
<li><p>نتيجة تجربة لتصنيف الشكاوى: 94% على الشكاوى المكتوبة إلكترونيًّا (500 شكوى)، و71% على المكالمات المفرَّغة (100). في الإنتاج نصف الشكاوى مكالمات. ما أهم ما تقوله لمالك المنتج؟</p><ul><li><b>أ.</b> المكالمات ضعيفة، ونصيبها في الإنتاج أكبر منه في التجربة</li><li><b>ب.</b> الدقة الكلية في التجربة نحو 90%، وهذا قريب من الهدف</li><li><b>ج.</b> العينة من 600 شكوى كبيرة بما يكفي لاعتماد النتيجة كما هي</li><li><b>د.</b> نحتاج نموذجًا أكبر وأحدث قبل أن نخطط لأي مرحلة أخرى</li></ul></li>
<li><p>معيار خروج كتبه فريق: «يعمل التصنيف بدقة مقبولة على عينة مناسبة». المراجع يحكم عليه بأنه قابل للتحقق.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في خطة مراحل تزايدية، متى يُكتب ما يحدث إن لم يتحقق معيار الخروج؟</p><ul><li><b>أ.</b> بعد النتيجة، حين يُعرف حجم الفجوة بين المقيس والعتبة</li><li><b>ب.</b> في اجتماع البوابة، باتفاق الحاضرين على ما يناسب</li><li><b>ج.</b> حين يطلبه الراعي في تقرير الحالة الشهري</li><li><b>د.</b> قبل بدء المرحلة، مع معيار الخروج نفسه وعتبته</li></ul></li>
<li><p>في مشروع لتلخيص المحاضر: قائد التقييم يشغّل الاختبار ويكتب النتائج، ومهندس المورِّد يضبط النموذج، وقائد التسليم يوصي. من يكون المساءَل (A) عن قرار البوابة؟</p><ul><li><b>أ.</b> قائد التقييم، لأنه أعرف الفريق بالنتائج وحدودها</li><li><b>ب.</b> الراعي، بعد توصية قائد التسليم بالقرار</li><li><b>ج.</b> مهندس المورِّد، لأنه يعرف ما يمكن إصلاحه وكلفته</li><li><b>د.</b> قائد التسليم وقائد التقييم معًا، باتفاقهما على القرار</li></ul></li>
<li><p>خطة مدتها 12 أسبوعًا. أربعة مشروعات ذكاء اصطناعي سابقة نسبها (الفعلي ÷ المخطط) 1.2 و1.4 و1.5 و2.1. ما القيمة الأرجح للمدة بالمئين 50؟</p><ul><li><b>أ.</b> 12 أسبوعًا</li><li><b>ب.</b> نحو 25.2 أسبوعًا</li><li><b>ج.</b> نحو 17.4 أسبوعًا</li><li><b>د.</b> نحو 14.4 أسبوعًا</li></ul></li>
<li><p>سجل مخاطر لخدمة توجيه المراسلات فيه: «جودة البيانات»، المالك «الفريق»، المعالجة «المتابعة». ما أهم ما ينقص هذا السطر؟</p><ul><li><b>أ.</b> رقم للاحتمالية بدقة أعلى من الدرجات الأربع</li><li><b>ب.</b> لون يميّز المستوى في لوحة المتابعة الأسبوعية</li><li><b>ج.</b> تاريخ إضافة السطر واسم من أضافه</li><li><b>د.</b> حدث بسبب وأثر، ومالك واحد، وخيار معالجة</li></ul></li>
<li><p>خطر احتماليته 2 (غير مرجّح) وأثره 4 (كارثي) في الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي. ما مستواه؟</p><ul><li><b>أ.</b> مرتفع</li><li><b>ب.</b> متوسط</li><li><b>ج.</b> كارثي</li><li><b>د.</b> منخفض</li></ul></li>
<li><p>نقل خطر سحب إصدار النموذج إلى المورِّد ببند في العقد لا يلغي مسؤولية الوزارة عن أثره على خدمتها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>قائمة أعمال مشروع لاستخراج بيانات الفواتير فيها 16 بطاقة بناء وبطاقة تقييم واحدة في المرحلة الأولى. ما الخطر في ذلك؟</p><ul><li><b>أ.</b> لا خطر، فالتقييم يُعمل مرة واحدة في آخر المشروع قبل الإطلاق</li><li><b>ب.</b> المراحل التالية لا تملك دليلًا تحكم به على معايير خروجها</li><li><b>ج.</b> البطاقات كثيرة على اللوحة فيصعب على الفريق تتبعها</li><li><b>د.</b> التقييم عمل المورِّد المنفِّذ لا عمل فريق الوزارة</li></ul></li>
<li><p>بوابة لخدمة توجيه المراسلات: المعيار 94% على 400 رسالة، والنتيجة 95.5%. لكن الفاكسات (60 رسالة منها) 78%، والمعيار لم يذكر الشرائح. الإنفاق ضمن الخطة. ما أفضل قرار؟</p><ul><li><b>أ.</b> المضي بشرط: الفاكسات إلى موظف حتى تُختبر في مرحلة</li><li><b>ب.</b> المضي دون شروط، فالمعيار المكتوب تحقق على 400 رسالة</li><li><b>ج.</b> التوقف، فالفاكسات ضعيفة والخدمة لا تُطلق بشريحة كهذه</li><li><b>د.</b> إعادة كتابة المعيار ليشمل الفاكسات ثم الحكم عليه الآن</li></ul></li>
<li><p>من يكتب «أوصى به» في سجل البوابة؟</p><ul><li><b>أ.</b> الراعي</li><li><b>ب.</b> قائد التقييم</li><li><b>ج.</b> قائد التسليم</li><li><b>د.</b> المورِّد المنفِّذ</li></ul></li>
<li><p>تقرير حالة يقول «المشروع أخضر» دون نطاق للموعد يكفي ما دامت كل المهام في موعدها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: القرار والتسليم</h2>
<ol>
<li><p>مصفوفة مسؤوليات لخدمة توجيه المراسلات في الإدارة القانونية. أي سطر يحتاج تصحيحًا قبل أن تُعتمد المصفوفة؟</p><ul><li><b>أ.</b> كتابة وثيقة التسليم: R قائد التسليم، وA مدير العمليات</li><li><b>ب.</b> تعديل الهدف: R مالك المنتج، وA الراعي</li><li><b>ج.</b> قبول إصدار جديد من النموذج: R مهندس المورِّد، وA مهندس المورِّد</li><li><b>د.</b> اعتماد الوصول إلى البيانات: R مهندس البيانات، وA مكتب إدارة البيانات</li></ul></li>
<li><p>وصلت حزمة جولة في محاكاة لخدمة تلخيص المحاضر: تقرير حالة يقول فيه المورِّد «النتائج ممتازة»، وملف نتائج، وحدث. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> قراءة تقرير الحالة كاملًا لفهم السياق قبل الأرقام</li><li><b>ب.</b> كتابة قرار البوابة على الحدث، فهو أهم ما في الحزمة</li><li><b>ج.</b> تحديث سجل المخاطر بالحدث، ثم قراءة النتائج</li><li><b>د.</b> حساب النتائج من ملفها مقابل معيار الخروج</li></ul></li>
<li><p>أربع جمل من وثيقة تسليم لخدمة توجيه المراسلات، والمزوّد أعلن سحب الإصدار السابق الشهر القادم. أيها تجتاز بندها؟</p><ul><li><b>أ.</b> التراجع: نعود إلى الإصدار السابق من النموذج عند أي مشكلة</li><li><b>ب.</b> مالك الحوادث مدير الدعم الفني ونائبه، والإبلاغ عبر نظام البلاغات</li><li><b>ج.</b> التحديثات: ينقل المورِّد الخدمة إلى كل إصدار جديد فور صدوره</li><li><b>د.</b> المراقبة: لوحة تعرض الدقة ونسبة التوجيه الآلي وعدد الرسائل كل يوم للفريق</li></ul></li>
<li><p>في جولة من مشروع تلخيص المحاضر وقع الخطر «تأخر رد الجهة على طلب البيانات». ما التحديث الصحيح في السجل؟</p><ul><li><b>أ.</b> حذف السطر من السجل لأن الخطر وقع ولم يعد احتمالًا</li><li><b>ب.</b> رفع الاحتمالية إلى أعلى درجة وإبقاء السطر كما هو</li><li><b>ج.</b> نقله إلى تقرير الحالة وحده لأن الراعي يقرؤه</li><li><b>د.</b> تسجيله واقعًا بأثره، وتحديث النطاق والمعالجة والمالك</li></ul></li>
<li><p>في مشروع تلخيص المحاضر وصل إشعار من المزوّد بسحب الإصدار الحالي بعد 60 يومًا. المرحلة الحالية حققت معيارها على هذا الإصدار. ما القرار عند البوابة؟</p><ul><li><b>أ.</b> التوقف حتى يستقر المزوّد على إصدار لا يُسحب قريبًا</li><li><b>ب.</b> المضي، مع إعادة التقييم بالإصدار الجديد قبل موعد السحب</li><li><b>ج.</b> المضي دون تغيير في الخطة، فالنتيجة تحققت على الإصدار الحالي</li><li><b>د.</b> ترك الأمر للمورِّد المنفِّذ لأنه صاحب العقد مع المزوّد</li></ul></li>
<li><p>بوابة: المعيار لم يتحقق (90.4% مقابل 92%)، والأخطاء موزعة على كل أنواع المحاضر، والتكلفة المتوقعة للإكمال تتجاوز الميزانية المعتمدة. ما القرار بقواعد المقرر؟</p><ul><li><b>أ.</b> التوقف، وإغلاق المشروع بسجل</li><li><b>ب.</b> تغيير الاتجاه إلى نوع واحد من المحاضر</li><li><b>ج.</b> المضي بشروط</li><li><b>د.</b> تمديد المرحلة أسبوعين</li></ul></li>
<li><p>وثيقة تسليم لخدمة توجيه المراسلات تقول في التراجع: «نعود إلى الإصدار السابق من النموذج». المزوّد أعلن سحب ذلك الإصدار الشهر القادم. ما الإصلاح؟</p><ul><li><b>أ.</b> إبقاء الجملة، فالإصدار السابق ما زال متاحًا اليوم</li><li><b>ب.</b> حذف قسم التراجع، فالنموذج الجديد أفضل من السابق</li><li><b>ج.</b> الطلب من المزوّد إبقاء الإصدار السابق متاحًا للوزارة</li><li><b>د.</b> تراجع مختبَر إلى المعالجة اليدوية، بمالك وأقصى مدة</li></ul></li>
<li><p>وثيقة تسليم لخدمة توجيه المراسلات تقول: «مالك الحوادث مدير الدعم الفني في الإدارة القانونية، ونائبه من فريقه، ويُبلَّغ عن الحادث عبر نظام البلاغات، ويُستدعى المورِّد للإصلاح». هذا يجتاز بند مالك الحوادث في قائمة الجاهزية.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>عتبة مراقبة خدمة توجيه المراسلات: دقة 96% في عينة تدقيق أسبوعية من 200 رسالة. ثلاثة أسابيع: 98%، ثم 97%، ثم 94.5%. ماذا تقول وثيقة التسليم الجيدة إنه يحدث الآن؟</p><ul><li><b>أ.</b> لا شيء، فمتوسط الأسابيع الثلاثة ما زال فوق العتبة</li><li><b>ب.</b> يُطلب من المورِّد إعادة تدريب النموذج فورًا</li><li><b>ج.</b> يُفتح حادث ويُبلَّغ مالكه، بحسب الإجراء المكتوب</li><li><b>د.</b> تُخفض العتبة إلى 94% لأن الانخفاض صغير</li></ul></li>
<li><p>أي مما يلي معيار لإيقاف الخدمة يصلح لوثيقة التسليم؟</p><ul><li><b>أ.</b> إذا رأى الموظفون أن أحدًا لم يعد يستعمل الخدمة</li><li><b>ب.</b> دقة العينة دون 96% أربعة أسابيع رغم المعالجة</li><li><b>ج.</b> إذا طلب المورِّد المنفِّذ ذلك عند تجديد العقد</li><li><b>د.</b> بعد خمس سنوات من الإطلاق، أيًّا كان الأداء</li></ul></li>
<li><p>من يعتمد استلام الخدمة في التشغيل ويوقّع وثيقة التسليم؟</p><ul><li><b>أ.</b> مدير العمليات المستلِم</li><li><b>ب.</b> قائد التسليم الذي كتبها</li><li><b>ج.</b> مدير المشروع لدى المورِّد</li><li><b>د.</b> مالك المنتج وحده</li></ul></li>
</ol>
